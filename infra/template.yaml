AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KDMeuSalario - Finance app with Cognito auth + DynamoDB + SQS

Globals:
  Function:
    Timeout: 60
    Runtime: python3.13
    MemorySize: 256
    Environment:
      Variables:
        BUCKET_NAME: !Ref InvoiceBucket
        BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-5-20250929-v1:0
        USER_DATA_TABLE: !Ref UserDataTable
        INVOICE_QUEUE_URL: !Ref InvoiceQueue

Resources:
  # ==================== AUTH ====================
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kdmeusalario-pre-signup
      CodeUri: lambda/
      Handler: pre_signup.handler
      Timeout: 10
      MemorySize: 128
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminLinkProviderForUser
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: kdmeusalario-users
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true
        - Name: role
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MaxLength: '20'
        - Name: plan
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MaxLength: '20'

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: kdmeusalario-web
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ==================== DATABASE ====================
  UserDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: kdmeusalario-user-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: dataType
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: dataType
          KeyType: RANGE

  # ==================== SQS ====================
  InvoiceDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: kdmeusalario-invoice-dlq
      MessageRetentionPeriod: 1209600  # 14 days

  InvoiceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: kdmeusalario-invoice-queue
      VisibilityTimeout: 600  # 10 min (must be > worker Lambda timeout)
      MessageRetentionPeriod: 86400  # 1 day
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt InvoiceDLQ.Arn
        maxReceiveCount: 3  # 3 tentativas antes de ir pra DLQ

  # ==================== STORAGE ====================
  InvoiceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kdmeusalario-invoices-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT, GET]
            AllowedOrigins:
              - !Sub 'https://${WebDistribution.DomainName}'
              - 'https://kdmeusalario.pages.dev'
              - 'https://cademeusalario.com.br'
              - 'https://www.cademeusalario.com.br'
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldFiles
            Status: Enabled
            ExpirationInDays: 30

  # ==================== API ====================
  InvoiceApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${WebDistribution.DomainName}'
          - 'https://kdmeusalario.pages.dev'
          - 'https://cademeusalario.com.br'
          - 'https://www.cademeusalario.com.br'
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      RouteSettings:
        "POST /process":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2

  # ==================== USER DATA LAMBDA ====================
  UserDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kdmeusalario-user-data
      CodeUri: lambda/
      Handler: user_data.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
      Events:
        GetData:
          Type: HttpApi
          Properties:
            ApiId: !Ref InvoiceApi
            Path: /user-data/{dataType}
            Method: GET
        SaveData:
          Type: HttpApi
          Properties:
            ApiId: !Ref InvoiceApi
            Path: /user-data/{dataType}
            Method: PUT

  # ==================== INVOICE LAMBDAS ====================
  ProcessInvoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kdmeusalario-process-invoice
      CodeUri: lambda/
      Handler: process_invoice.handler
      Timeout: 30
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt InvoiceQueue.QueueName
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref InvoiceApi
            Path: /process
            Method: POST

  InvoiceWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kdmeusalario-invoice-worker
      CodeUri: lambda/
      Handler: invoice_worker.handler
      Timeout: 300
      MemorySize: 512
      ReservedConcurrentExecutions: 2
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref InvoiceBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
        - Statement:
            - Effect: Allow
              Action:
                - textract:DetectDocumentText
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
                - textract:AnalyzeExpense
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:*::foundation-model/*anthropic.claude-sonnet-4-5-20250929-v1:0'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*anthropic.claude-sonnet-4-5-20250929-v1:0'
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt InvoiceQueue.Arn
            BatchSize: 1

  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kdmeusalario-get-upload-url
      CodeUri: lambda/
      Handler: get_upload_url.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref InvoiceBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref InvoiceApi
            Path: /upload-url
            Method: POST

  CheckStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kdmeusalario-check-status
      CodeUri: lambda/
      Handler: check_status.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
        - Statement:
            - Effect: Allow
              Action:
                - textract:GetDocumentTextDetection
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:*::foundation-model/*anthropic.claude-sonnet-4-5-20250929-v1:0'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*anthropic.claude-sonnet-4-5-20250929-v1:0'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref InvoiceApi
            Path: /check-status
            Method: POST

  GetConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kdmeusalario-get-config
      CodeUri: lambda/
      Handler: get_config.handler
      Timeout: 10
      MemorySize: 128
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kdmeusalario/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref InvoiceApi
            Path: /config
            Method: GET
            Auth:
              Authorizer: NONE

  # ==================== STRIPE BILLING ====================
  CreateCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kdmeusalario-create-checkout
      CodeUri: lambda/
      Handler: create_checkout.handler
      Timeout: 15
      MemorySize: 128
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kdmeusalario/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref InvoiceApi
            Path: /checkout
            Method: POST

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kdmeusalario-stripe-webhook
      CodeUri: lambda/
      Handler: stripe_webhook.handler
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kdmeusalario/*
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref InvoiceApi
            Path: /stripe-webhook
            Method: POST
            Auth:
              Authorizer: NONE

  DemoInvoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kdmeusalario-demo-invoice
      CodeUri: lambda/
      Handler: demo_invoice.handler
      Timeout: 30
      MemorySize: 256
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref InvoiceBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref UserDataTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt InvoiceQueue.QueueName
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref InvoiceApi
            Path: /demo/invoice
            Method: POST
            Auth:
              Authorizer: NONE

  # ==================== FRONTEND HOSTING ====================
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kdmeusalario-web-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: kdmeusalario-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${InvoiceApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  BucketName:
    Description: S3 bucket for invoices
    Value: !Ref InvoiceBucket
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  WebsiteUrl:
    Description: CloudFront website URL
    Value: !Sub https://${WebDistribution.DomainName}
  WebBucketName:
    Description: S3 bucket for frontend
    Value: !Ref WebBucket
  InvoiceQueueUrl:
    Description: SQS Queue URL for invoice processing
    Value: !Ref InvoiceQueue
  InvoiceDLQUrl:
    Description: Dead Letter Queue URL
    Value: !Ref InvoiceDLQ
